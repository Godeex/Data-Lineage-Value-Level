[project]
name = "agentdb-semantic-lineage"
version = "0.1.0"
description = "Oracle-guided semantic lineage verification pilot (AgentDB-261102)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "sqlglot>=30,<31",
    "duckdb>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "hypothesis>=6.155,<7",
    "ruff>=0.15",
]
figures = [
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdb"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x"
